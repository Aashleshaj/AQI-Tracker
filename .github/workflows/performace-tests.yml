name: Performance Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC

jobs:
  jmeter-load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up -d --build
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          OLLAMA_AQI_MODEL: gemma3:4b
          MOCK_WAQI: "true"

      - name: Wait for aqi-api to be ready
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8000/aqi/london && break
            sleep 5
          done

      - name: Set up JMeter
        run: |
          wget -q https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Run JMeter test plan
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter -n \
            -t performance/erformance-tests/AQI_API_load.jmx \
            -l performance/performance-tests/results.jtl \
            -e -o performance/performance-tests/report

      - name: Check thresholds
        run: python3 performance-tests/check_threshold.py performance-tests/results.jtl

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: performance-tests/report
